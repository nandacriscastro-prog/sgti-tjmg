.sb-sec{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.28);padding:12px 18px 4px;white-space:nowrap}

.nav-icon{width:18px;height:18px;flex-shrink:0;opacity:.75}

.nav-lbl{overflow:hidden}.col .nav-lbl{display:none}
.nav-badge{margin-left:auto;background:var(--accent);color:white;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;flex-shrink:0}
.col .nav-badge{display:none}
.nav-tip{display:none;position:absolute;left:56px;top:50%;transform:translateY(-50%);background:var(--navy3);color:white;font-size:12px;padding:5px 10px;border-radius:5px;white-space:nowrap;z-index:100;box-shadow:var(--shadow)}

.sb-div{height:1px;background:rgba(255,255,255,.06);margin:6px 16px}

.sb-user:hover{background:rgba(255,255,255,.07)}
.u-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.u-name{font-size:12px;font-weight:600;color:white;white-space:nowrap}

.tb-toggle{width:32px;height:32px;border:none;background:none;cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:var(--tr)}

.tb-crumb .sep{color:var(--text3)}.tb-crumb .cur{font-weight:600}.tb-crumb .par{color:var(--text3)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.dot-online{width:8px;height:8px;border-radius:50%;background:var(--green)}
.dot-offline{width:8px;height:8px;border-radius:50%;background:#dc2626}
.tb-status{font-size:11px;color:var(--text3);font-family:var(--mono)}
.content{flex:1;overflow-y:auto;padding:24px}
.content::-webkit-scrollbar{width:6px}

.ph{margin-bottom:24px}.ph-title{font-size:20px;font-weight:700}.ph-sub{font-size:13px;color:var(--text3);margin-top:3px}

.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.card-title{font-size:12px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}

.flex{display:flex}.flex-center{display:flex;align-items:center;justify-content:center}

.fw-700{font-weight:700}.text-sm{font-size:12px}.text-muted{color:var(--text3)}.text-mono{font-family:var(--mono)}

}
